[package]
name = "accessible-qemu"
version = "0.1.0"
edition = "2024"
description = "Accessibility-first graphical frontend and controller for QEMU"
license = "Apache-2.0"

[dependencies]
eframe = { version = "0.36.2", default-features = true }
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
