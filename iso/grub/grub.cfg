# AccessibleAndroid ISO boot menu.
# This menu must remain usable without sight. The default path boots the
# speech-enabled installer automatically.

set default=0
set timeout=5
set timeout_style=menu

# Prefer both local console and serial. A serial terminal gives an independent
# non-visual path when a hypervisor exposes COM1.
insmod serial
serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input console serial
terminal_output console serial

# Audible startup cue when GRUB's play backend is available.
insmod play
play 120 880 1 0 1 1320 1

menuentry --hotkey=a 'Accessible installer - speech + serial (default)' {
    echo 'Starting AccessibleAndroid speech installer'
    play 160 880 1 1175 1 1568 1
    linux /boot/vmlinuz-installer console=tty0 console=ttyS0,115200n8 speakup.synth=soft accessibleandroid.mode=install
    initrd /boot/initramfs-accessible.cpio.gz
}

menuentry --hotkey=s 'Accessible installer - serial-first fallback' {
    echo 'Starting serial-first installer fallback'
    play 160 880 1 0 1 880 1
    linux /boot/vmlinuz-installer console=ttyS0,115200n8 console=tty0 accessibleandroid.mode=install accessibleandroid.speech=retry
    initrd /boot/initramfs-accessible.cpio.gz
}

menuentry --hotkey=r 'Accessible recovery shell - no disk writes' {
    echo 'Starting recovery shell with disk writes disabled'
    play 160 660 1 0 1 660 1 0 1 660 1
    linux /boot/vmlinuz-installer console=tty0 console=ttyS0,115200n8 speakup.synth=soft accessibleandroid.mode=recovery accessibleandroid.readonly=1
    initrd /boot/initramfs-accessible.cpio.gz
}
