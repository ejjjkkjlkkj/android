# AccessibleAndroid ISO boot menu.
# Accessibility is additive: keep the visible GRUB menu and local console while
# adding keyboard hotkeys, sound cues, Speakup boot arguments and serial mirror.

set default=0
set timeout=5
set timeout_style=menu
set color_normal=white/black
set color_highlight=black/light-gray

# Keep the local console visible and mirror it to serial. Neither output path
# replaces the other.
insmod serial
serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input console serial
terminal_output console serial

# Audible startup cue when GRUB's play backend is available. This is an
# additional cue; the visible menu remains active.
insmod play
play 120 880 1 0 1 1320 1

menuentry --hotkey=a 'Accessible installer - visual + screen reader + serial (default)' {
    echo 'Starting AccessibleAndroid installer: visual interface and screen-reader path enabled'
    play 160 880 1 1175 1 1568 1
    linux /boot/vmlinuz-installer console=tty0 console=ttyS0,115200n8 speakup.synth=soft accessibleandroid.mode=install accessibleandroid.visual=1 accessibleandroid.screenreader=1
    initrd /boot/initramfs-accessible.cpio.gz
}

menuentry --hotkey=s 'Accessible installer - visual + serial fallback' {
    echo 'Starting installer with visible console and serial fallback'
    play 160 880 1 0 1 880 1
    linux /boot/vmlinuz-installer console=tty0 console=ttyS0,115200n8 accessibleandroid.mode=install accessibleandroid.visual=1 accessibleandroid.screenreader=retry
    initrd /boot/initramfs-accessible.cpio.gz
}

menuentry --hotkey=r 'Accessible recovery - visual + screen reader - no disk writes' {
    echo 'Starting visible accessible recovery with disk writes disabled'
    play 160 660 1 0 1 660 1 0 1 660 1
    linux /boot/vmlinuz-installer console=tty0 console=ttyS0,115200n8 speakup.synth=soft accessibleandroid.mode=recovery accessibleandroid.readonly=1 accessibleandroid.visual=1 accessibleandroid.screenreader=1
    initrd /boot/initramfs-accessible.cpio.gz
}
