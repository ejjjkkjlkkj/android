name: Validate repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Parse shell scripts
        run: bash -n scripts/*.sh

      - name: ShellCheck
        run: shellcheck scripts/*.sh

      - name: Reject packaged Android binaries in repository
        run: bash scripts/check-no-proprietary.sh

      - name: Verify GMS input fails closed when no authorized bundle is supplied
        run: |
          if GMS_BUNDLE_DIR= bash scripts/validate-gms-input.sh; then
            echo 'ERROR: GMS validator accepted an empty private input' >&2
            exit 1
          fi
          echo 'GMS_FAIL_CLOSED = PASS'

      - name: Validate edition configuration
        run: |
          set -euo pipefail
          source config/editions.env
          test "$DEFAULT_EDITION" = "accessible-aosp"
          test "$GMS_EDITION" = "accessible-gms"
          test -n "$AOSP_PRODUCT"
          test -n "$GMS_PRODUCT"
          echo 'EDITION_CONFIG = PASS'

      - name: Validate Android 17 lunch configuration
        run: |
          set -euo pipefail
          source config/upstream.env
          source config/editions.env
          test "$ANDROID_API_LEVEL" = "37"
          test -n "$ANDROID_RELEASE_CONFIG"
          grep -Fq "${AOSP_PRODUCT}-${ANDROID_RELEASE_CONFIG}-userdebug" device/accessibledroid/accessible_x86_64/AndroidProducts.mk
          grep -Fq "${GMS_PRODUCT}-${ANDROID_RELEASE_CONFIG}-userdebug" device/accessibledroid/accessible_x86_64/AndroidProducts.mk
          grep -Fq 'LUNCH_TARGET="${PRODUCT}-${RELEASE_CONFIG}-${VARIANT}"' scripts/build-pc-iso.sh
          echo "ANDROID_LUNCH_CONFIG = PASS (${ANDROID_RELEASE_CONFIG})"

      - name: Validate Android 17 x86_64 kernel contract
        run: |
          set -euo pipefail
          source config/kernel.env
          test "$KERNEL_FAMILY" = "android17-6.18"
          test "$KERNEL_ARCH" = "x86_64"
          test "$KERNEL_BUILD_TARGET" = "//common-modules/virtual-device:virtual_device_x86_64"
          test "$KERNEL_DIST_TARGET" = "//common-modules/virtual-device:virtual_device_x86_64_dist"
          test "$KERNEL_IMAGE_NAME" = "bzImage"
          test -n "$KERNEL_REQUIRED_VM_MODULES"
          grep -Fq 'TARGET_NO_KERNEL := false' device/accessibledroid/accessible_x86_64/BoardConfig.mk
          grep -Fq 'TARGET_PREBUILT_KERNEL := $(LOCAL_ACCESSIBLE_DEVICE)/prebuilt/kernel' device/accessibledroid/accessible_x86_64/BoardConfig.mk
          grep -Fq 'initramfs.img' scripts/build-kernel.sh
          grep -Fq 'prebuilt/modules' scripts/stage-kernel.sh
          if grep -R -n -E --include='*.sh' '^[[:space:]]*(source|\.)[[:space:]].*build\.config\.x86_64' scripts; then
            echo 'ERROR: legacy Android kernel build.config.x86_64 sourcing is forbidden.' >&2
            exit 1
          fi
          echo "ANDROID_KERNEL_CONTRACT = PASS ($KERNEL_FAMILY $KERNEL_ARCH)"

      - name: Protect the official AOSP tree from PC reference overlays
        run: |
          set -euo pipefail
          grep -Fq 'PC_REFERENCE_DIR=' config/workspace.env
          grep -Fq 'PC_REFERENCE_DIR/device_generic_common' scripts/sync-pc-upstreams.sh
          grep -Fq 'PC_REFERENCE_DIR/device_generic_x86_64' scripts/sync-pc-upstreams.sh
          if grep -Eq '\$AOSP_DIR/(device/generic/(common|x86_64)|bootable/aaropa)' scripts/sync-pc-upstreams.sh; then
            echo 'ERROR: PC reference sync must not overwrite official AOSP sources.' >&2
            exit 1
          fi
          if grep -Fq 'device/generic/common/x86_64.mk' device/accessibledroid/accessible_x86_64/accessible_android_x86_64_base.mk; then
            echo 'ERROR: AccessibleAndroid product must not inherit the legacy Bliss/Android-x86 product root.' >&2
            exit 1
          fi
          grep -Fq '$(SRC_TARGET_DIR)/product/generic_system.mk' device/accessibledroid/accessible_x86_64/accessible_android_x86_64_base.mk
          grep -Fq '$(SRC_TARGET_DIR)/product/handheld_system_ext.mk' device/accessibledroid/accessible_x86_64/accessible_android_x86_64_base.mk
          echo 'AOSP_TREE_ISOLATION = PASS'

      - name: Validate modern boot and dynamic partition contract
        run: |
          set -euo pipefail
          board=device/accessibledroid/accessible_x86_64/BoardConfig.mk
          product=device/accessibledroid/accessible_x86_64/accessible_android_x86_64_base.mk
          fstab=device/accessibledroid/accessible_x86_64/fstab.accessible_x86_64
          grep -Fq 'BOARD_BOOT_HEADER_VERSION := 4' "$board"
          grep -Fq 'BOARD_INIT_BOOT_IMAGE_PARTITION_SIZE := 8388608' "$board"
          grep -Fq 'BOARD_VENDOR_BOOTIMAGE_PARTITION_SIZE := 67108864' "$board"
          grep -Fq 'BOARD_VENDOR_RAMDISK_KERNEL_MODULES :=' "$board"
          grep -Fq 'BOARD_VENDOR_KERNEL_MODULES :=' "$board"
          grep -Fq 'BOARD_SUPER_PARTITION_SIZE := 7516192768' "$board"
          grep -Fq 'AB_OTA_UPDATER := true' "$board"
          grep -Fq 'BOARD_AVB_ENABLE := true' "$board"
          grep -Fq 'PRODUCT_USE_DYNAMIC_PARTITIONS := true' "$product"
          grep -Fq 'fstab.accessible_x86_64:$(TARGET_COPY_OUT_VENDOR)/etc/fstab.accessible_x86_64' "$product"
          grep -Fq 'logical,first_stage_mount,slotselect,avb' "$fstab"
          grep -Fq '/dev/block/by-name/userdata' "$fstab"
          echo 'ANDROID_BOOT_LAYOUT = PASS'
