name: Validate repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Parse shell scripts
        run: bash -n scripts/*.sh

      - name: ShellCheck
        run: shellcheck scripts/*.sh

      - name: Reject packaged Android binaries in repository
        run: bash scripts/check-no-proprietary.sh

      - name: Verify GMS input fails closed when no authorized bundle is supplied
        run: |
          if GMS_BUNDLE_DIR= bash scripts/validate-gms-input.sh; then
            echo 'ERROR: GMS validator accepted an empty private input' >&2
            exit 1
          fi
          echo 'GMS_FAIL_CLOSED = PASS'

      - name: Validate edition configuration
        run: |
          set -euo pipefail
          source config/editions.env
          test "$DEFAULT_EDITION" = "accessible-aosp"
          test "$GMS_EDITION" = "accessible-gms"
          test -n "$AOSP_PRODUCT"
          test -n "$GMS_PRODUCT"
          echo 'EDITION_CONFIG = PASS'

      - name: Validate Android 17 lunch configuration
        run: |
          set -euo pipefail
          source config/upstream.env
          source config/editions.env
          test "$ANDROID_API_LEVEL" = "37"
          test -n "$ANDROID_RELEASE_CONFIG"
          grep -Fq "${AOSP_PRODUCT}-${ANDROID_RELEASE_CONFIG}-userdebug" device/accessibledroid/accessible_x86_64/AndroidProducts.mk
          grep -Fq "${GMS_PRODUCT}-${ANDROID_RELEASE_CONFIG}-userdebug" device/accessibledroid/accessible_x86_64/AndroidProducts.mk
          grep -Fq 'LUNCH_TARGET="${PRODUCT}-${RELEASE_CONFIG}-${VARIANT}"' scripts/build-pc-iso.sh
          echo "ANDROID_LUNCH_CONFIG = PASS (${ANDROID_RELEASE_CONFIG})"

      - name: Validate Android 17 x86_64 kernel contract
        run: |
          set -euo pipefail
          source config/kernel.env
          test "$KERNEL_FAMILY" = "android17-6.18"
          test "$KERNEL_ARCH" = "x86_64"
          test "$KERNEL_BUILD_TARGET" = "//common-modules/virtual-device:virtual_device_x86_64"
          test "$KERNEL_DIST_TARGET" = "//common-modules/virtual-device:virtual_device_x86_64_dist"
          test "$KERNEL_IMAGE_NAME" = "bzImage"
          test -n "$KERNEL_REQUIRED_VM_MODULES"
          grep -Fq 'TARGET_NO_KERNEL := false' device/accessibledroid/accessible_x86_64/BoardConfig.mk
          grep -Fq 'TARGET_PREBUILT_KERNEL := device/accessibledroid/accessible_x86_64/prebuilt/kernel' device/accessibledroid/accessible_x86_64/BoardConfig.mk
          grep -Fq 'initramfs.img' scripts/build-kernel.sh
          if grep -R -n -E --include='*.sh' '^[[:space:]]*(source|\.)[[:space:]].*build\.config\.x86_64' scripts; then
            echo 'ERROR: legacy Android kernel build.config.x86_64 sourcing is forbidden.' >&2
            exit 1
          fi
          echo "ANDROID_KERNEL_CONTRACT = PASS ($KERNEL_FAMILY $KERNEL_ARCH)"
