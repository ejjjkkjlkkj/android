name: AccessibleUTM UIA Interactive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uia-interactive:
    name: Strict UIA and keyboard validation on interactive Windows
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Verify interactive desktop
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          $session = (Get-Process -Id $PID).SessionId
          Write-Host "SESSION_ID = $session"
          Write-Host "USER_INTERACTIVE = $([Environment]::UserInteractive)"
          if (-not [Environment]::UserInteractive) {
            throw 'Strict UIA validation requires an interactive Windows desktop session.'
          }
          if ($session -eq 0) {
            throw 'Runner is in Windows Session 0. Launch the self-hosted runner inside the signed-in desktop session.'
          }
          Write-Host 'ACCESSIBLE_UTM_INTERACTIVE_DESKTOP = PASS'

      - name: Verify locked Rust dependency graph
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'accessible-utm/Cargo.lock')) {
            throw 'accessible-utm/Cargo.lock must be committed.'
          }
          cargo metadata --locked --no-deps --manifest-path accessible-utm/Cargo.toml --format-version 1 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "cargo metadata --locked failed: $LASTEXITCODE" }
          Write-Host 'ACCESSIBLE_UTM_CARGO_LOCK = VERIFIED'

      - name: Build AccessibleUTM
        shell: pwsh
        run: |
          rustc -vV
          cargo -V
          cargo test --release --locked --manifest-path accessible-utm/Cargo.toml
          cargo build --release --locked --manifest-path accessible-utm/Cargo.toml

      - name: Strict interactive accessibility evidence gate
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'AccessibleUTM-Interactive-Evidence'
          ./accessible-utm/tests/windows_interactive_gate.ps1 -SkipBuild -OutputDirectory $evidence
          Write-Host 'ACCESSIBLE_UTM_UIA_INTERACTIVE = VERIFIED_PASS'
          Write-Host 'ACCESSIBLE_UTM_SCREEN_READER_HUMAN_GATE = REQUIRED'

      - name: Upload interactive accessibility evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: AccessibleUTM-UIA-interactive-${{ github.sha }}
          path: |
            ${{ runner.temp }}/AccessibleUTM-Interactive-Evidence/**
            ${{ runner.temp }}/AccessibleUTM-Interactive-Evidence.zip
          if-no-files-found: error
