name: Android VM hardware contract

on:
  push:
    branches:
      - accessible-virtual-suite
    paths:
      - 'device/accessibledroid/accessible_x86_64/**'
      - 'vendor/accessibledroid/**'
      - 'config/accessibility-upstreams.env'
      - 'scripts/build-accessibility-apps.sh'
      - 'accessible-utm/src/qemu.rs'
      - 'scripts/test-preinstalled-disk-qemu.sh'
      - 'scripts/validate-vm-runtime.sh'
      - '.github/workflows/android-vm-hardware-contract.yml'
  pull_request:
    paths:
      - 'device/accessibledroid/accessible_x86_64/**'
      - 'vendor/accessibledroid/**'
      - 'config/accessibility-upstreams.env'
      - 'scripts/build-accessibility-apps.sh'
      - 'accessible-utm/src/qemu.rs'
      - 'scripts/test-preinstalled-disk-qemu.sh'
      - 'scripts/validate-vm-runtime.sh'
      - '.github/workflows/android-vm-hardware-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-vm-hardware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Validate Android 17 userspace VM hardware and accessible boot
        shell: bash
        run: |
          set -euo pipefail
          hw=device/accessibledroid/accessible_x86_64/vm_hardware.mk
          product=device/accessibledroid/accessible_x86_64/accessible_android_x86_64_base.mk
          board=device/accessibledroid/accessible_x86_64/BoardConfig.mk
          initrc=device/accessibledroid/accessible_x86_64/init.accessibledroid.rc
          probe=device/accessibledroid/accessible_x86_64/accessible-vm-hardware-probe.sh
          accessibility=vendor/accessibledroid/product/accessibility.mk
          upstream=config/accessibility-upstreams.env
          appbuild=scripts/build-accessibility-apps.sh
          bootstrap=vendor/accessibledroid/bootstrap/src/org/accessibledroid/bootstrap/BootReceiver.java
          qemu=accessible-utm/src/qemu.rs
          boot=scripts/test-preinstalled-disk-qemu.sh
          runtime=scripts/validate-vm-runtime.sh

          test -s "$hw"
          test -s "$probe"
          test -s "$accessibility"
          test -s "$upstream"
          test -s "$appbuild"
          test -s "$bootstrap"
          sh -n "$probe"
          bash -n "$appbuild"
          grep -Fq '$(call inherit-product, device/accessibledroid/accessible_x86_64/vm_hardware.mk)' "$product"
          grep -Fq 'accessible-vm-hardware-probe.sh:$(TARGET_COPY_OUT_VENDOR)/etc/accessible-vm-hardware-probe.sh' "$product"
          grep -Fq '/system/bin/sh /vendor/etc/accessible-vm-hardware-probe.sh' "$initrc"

          # Accessibility is a first-class system feature, not an optional host add-on.
          grep -Fq 'AccessibilityBootstrap' "$accessibility"
          grep -Fq 'AccessibleTalkBack' "$accessibility"
          grep -Fq 'AccessibleEspeakTts' "$accessibility"
          grep -Fq 'ro.vendor.accessibledroid.accessibility_required=true' "$accessibility"
          grep -Fq 'ro.vendor.accessibledroid.offline_tts_required=true' "$accessibility"
          grep -Fq 'TALKBACK_PACKAGE=com.google.android.accessibility.talkback' "$upstream"
          grep -Fq 'TALKBACK_SERVICE=com.google.android.accessibility.talkback/com.google.android.marvin.talkback.TalkBackService' "$upstream"
          grep -Fq 'ESPEAK_PACKAGE=com.reecedunn.espeak' "$upstream"
          grep -Fq 'com.google.android.accessibility.talkback' "$bootstrap"
          grep -Fq 'com.google.android.marvin.talkback.TalkBackService' "$bootstrap"
          grep -Fq 'com.reecedunn.espeak' "$bootstrap"
          grep -Fq 'Settings.Secure.ACCESSIBILITY_ENABLED' "$bootstrap"
          grep -Fq 'Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES' "$bootstrap"
          grep -Fq 'TTS_DEFAULT_SYNTH' "$bootstrap"

          # Generated APKs must match the pinned package/service contract before
          # they can be copied into the AOSP tree.
          grep -Fq '[[ "$TALKBACK_BUILT_PACKAGE" == "$TALKBACK_PACKAGE" ]]' "$appbuild"
          grep -Fq '[[ "$ESPEAK_BUILT_PACKAGE" == "$ESPEAK_PACKAGE" ]]' "$appbuild"
          grep -Fq 'dump packagename' "$appbuild"
          grep -Fq 'dump xmltree' "$appbuild"
          grep -Fq 'TALKBACK_SERVICE_CLASS="${TALKBACK_SERVICE#*/}"' "$appbuild"
          grep -Fq 'android.intent.action.TTS_SERVICE' "$appbuild"
          grep -Fq 'TALKBACK_SERVICE = VERIFIED' "$appbuild"
          grep -Fq 'ESPEAK_TTS_SERVICE = VERIFIED' "$appbuild"

          grep -Fq 'TALKBACK_COMPONENT=com.google.android.accessibility.talkback/com.google.android.marvin.talkback.TalkBackService' "$probe"
          grep -Fq 'ESPEAK_PACKAGE=com.reecedunn.espeak' "$probe"
          grep -Fq 'ACCESSIBILITY_WAIT_SECONDS=45' "$probe"
          grep -Fq 'ACCESSIBLE_ANDROID_TALKBACK=PASS' "$probe"
          grep -Fq 'ACCESSIBLE_ANDROID_OFFLINE_TTS=PASS' "$probe"
          grep -Fq 'ACCESSIBLE_ANDROID_ACCESSIBILITY_STACK=PASS' "$probe"

          # DRM/KMS + minigbm + software GLES for a standard QEMU virtio-gpu.
          grep -Fq 'android.hardware.composer.hwc3-service.drm' "$hw"
          grep -Fq 'android.hardware.graphics.allocator-service.minigbm' "$hw"
          grep -Fq 'mapper.minigbm' "$hw"
          grep -Fq '$(call soong_config_set,minigbm,platform,generic)' "$hw"
          grep -Fq 'libEGL_swiftshader' "$hw"
          grep -Fq 'libGLESv2_swiftshader' "$hw"
          grep -Fq 'ro.hardware.egl=swiftshader' "$hw"
          grep -Fq 'virtio-gpu.ko' "$board"
          grep -Fq 'virtio-vga,id=android-gpu' "$qemu"
          grep -Fq 'virtio-vga,id=android-gpu' "$boot"
          grep -Fq '/dev/dri/card0' "$probe"

          # Android 17 AIDL audio backed by ALSA/virtio-snd.
          grep -Fq 'com.android.hardware.audio' "$hw"
          grep -Fq 'device_google_cuttlefish_shared_config_audio_policy' "$hw"
          grep -Fq 'hardware/interfaces/audio/aidl/default/audio_effects.mk' "$hw"
          grep -Fq 'virtio_snd.ko' "$board"
          grep -Fq 'format!("{},id=android-audio", host_audio_driver())' "$qemu"
          grep -Fq 'virtio-sound-pci,audiodev=android-audio,streams=2,id=android-sound' "$qemu"
          grep -Fq 'virtio-sound-pci,audiodev=android-audio,streams=2,id=android-sound' "$boot"
          grep -Fq "none,id=android-audio" "$boot"
          grep -Fq '/proc/asound/cards' "$probe"
          grep -Fq 'AUDIO_VIRTIO=PASS' "$probe"
          grep -Fq 'service check audio' "$probe"
          grep -Fq 'dumpsys media.audio_flinger' "$probe"
          grep -Fq 'ACCESSIBLE_ANDROID_AUDIO_FRAMEWORK=PASS' "$probe"
          if grep -Fq '"-audio".to_owned()' "$qemu"; then
            echo 'ERROR: AccessibleUTM must use explicit -audiodev + virtio-sound-pci, not -audio shorthand.' >&2
            exit 1
          fi

          # Keyboard and absolute pointing device are first-class VM input.
          grep -Fq 'qemu-xhci,id=xhci' "$qemu"
          grep -Fq 'usb-kbd,bus=xhci.0,id=android-keyboard' "$qemu"
          grep -Fq 'usb-tablet,bus=xhci.0,id=android-tablet' "$qemu"
          grep -Fq "qemu-xhci,id=xhci" "$boot"
          grep -Fq "usb-kbd,bus=xhci.0,id=android-keyboard" "$boot"
          grep -Fq "usb-tablet,bus=xhci.0,id=android-tablet" "$boot"
          grep -Fq '/proc/bus/input/devices' "$probe"
          grep -Fq 'INPUT_KEYBOARD=PASS' "$probe"
          grep -Fq 'INPUT_POINTER=PASS' "$probe"

          # The fixed PCI layout must be observed from inside Android too.
          grep -Fq '/sys/bus/pci/devices/0000:00:06.0' "$probe"
          grep -Fq '/sys/bus/pci/devices/0000:00:07.0' "$probe"
          grep -Fq '/sys/bus/pci/devices/0000:00:08.0' "$probe"
          grep -Fq 'ACCESSIBLE_ANDROID_GUEST_HARDWARE=PASS' "$probe"

          # The preinstalled boot test must exercise the full VM hardware bundle,
          # require both accessibility and guest-side hardware proof, and stop early.
          grep -Fq 'HARDWARE_PROFILE="${HARDWARE_PROFILE:-full}"' "$boot"
          grep -Fq 'QEMU_VM_HARDWARE_CAPABILITIES = PASS' "$boot"
          grep -Fq "GUEST_ACCESSIBILITY_MARKER='ACCESSIBLE_ANDROID_ACCESSIBILITY_STACK=PASS'" "$boot"
          grep -Fq "GUEST_HARDWARE_MARKER='ACCESSIBLE_ANDROID_GUEST_HARDWARE=PASS'" "$boot"
          grep -Fq 'boot_proof_complete' "$boot"
          grep -Fq 'stop_qemu' "$boot"
          grep -Fq 'ACCESSIBILITY_STACK = PASS' "$boot"
          grep -Fq 'GUEST_VM_HARDWARE = PASS' "$boot"
          grep -Fq 'FULL_VM_HARDWARE_BOOT = PASS' "$boot"

          # ADB validation remains a second independent runtime validation path.
          grep -Fq 'service check SurfaceFlinger' "$runtime"
          grep -Fq 'dumpsys SurfaceFlinger' "$runtime"
          grep -Fq '/proc/asound/cards' "$runtime"
          grep -Fq 'service check audio' "$runtime"
          grep -Fq 'dumpsys accessibility' "$runtime"
          grep -Fq 'tts_default_synth' "$runtime"
          grep -Fq 'getevent -lp' "$runtime"
          grep -Fq 'ip -o link show' "$runtime"

          # Do not couple this portable profile to emulator-specific host protocols.
          # Comments may mention forbidden names while explaining the design, so
          # only active Makefile lines are checked here.
          active_hw="$(grep -Ev '^[[:space:]]*(#|$)' "$hw")"
          if grep -Eqi 'gfxstream|ranchu|goldfish-opengl' <<<"$active_hw"; then
            echo 'ERROR: portable AccessibleAndroid VM hardware layer depends on emulator-specific graphics.' >&2
            exit 1
          fi

          echo 'ANDROID_VM_HARDWARE_CONTRACT = PASS'
          echo 'ACCESSIBLE_BOOT_CONTRACT = PASS'
          echo 'ACCESSIBILITY_APK_IDENTITY_CONTRACT = PASS'
