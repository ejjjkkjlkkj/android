name: AccessibleUTM Live Region Bootstrap

on:
  push:
    branches:
      - accessible-virtual-suite
    paths:
      - '.github/workflows/accessible-utm-live-region-bootstrap.yml'

permissions:
  contents: write

jobs:
  apply-live-region:
    name: Add AccessKit live status region once
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Apply exact accessibility patch
        shell: python
        run: |
          from pathlib import Path

          main = Path('accessible-utm/src/main.rs')
          text = main.read_text(encoding='utf-8')
          old = '''        ui.heading("Status");
                  ui.label(&self.status);'''
          old = old.replace('                  ui.label', '        ui.label')
          new = '''        ui.heading("Status");
                  let status_response = ui.label(&self.status);
                  status_response
                      .ctx
                      .accesskit_node_builder(status_response.id, |node| {
                          node.set_live(egui::accesskit::Live::Polite);
                          node.set_live_atomic();
                      });'''
          new = new.replace('                  let status_response', '        let status_response')
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one status label block, found {text.count(old)}')
          main.write_text(text.replace(old, new, 1), encoding='utf-8')

          workflow = Path('.github/workflows/accessible-utm-windows.yml')
          text = workflow.read_text(encoding='utf-8')
          old = "            'Load configuration (Ctrl+O)'\n"
          new = "            'Load configuration (Ctrl+O)',\n            'set_live(egui::accesskit::Live::Polite)',\n            'set_live_atomic'\n"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one accessibility contract anchor, found {text.count(old)}')
          workflow.write_text(text.replace(old, new, 1), encoding='utf-8')

          readme = Path('accessible-utm/README.md')
          text = readme.read_text(encoding='utf-8')
          old = '- Status changes are rendered as readable text for screen readers.'
          new = '- Status changes are exposed as a polite, atomic AccessKit live region so screen readers can announce VM state and error updates without moving focus.'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one README status bullet, found {text.count(old)}')
          readme.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Verify Rust compiles with committed lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --manifest-path accessible-utm/Cargo.toml

      - name: Verify patch scope and commit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          printf 'Changed files:\n%s\n' "${changed[*]}"
          expected=(
            '.github/workflows/accessible-utm-windows.yml'
            'accessible-utm/README.md'
            'accessible-utm/src/main.rs'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "$(printf '%s\n' "${changed[@]}")" != "$(printf '%s\n' "${expected_sorted[@]}")" ]]; then
            echo 'Unexpected patch scope.' >&2
            exit 1
          fi
          git add "${expected[@]}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Announce AccessibleUTM status through AccessKit live region'
          git push origin HEAD:accessible-virtual-suite
          echo 'ACCESSIBLE_UTM_LIVE_REGION = COMMITTED'
