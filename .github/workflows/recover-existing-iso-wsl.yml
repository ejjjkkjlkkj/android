name: Recover existing Android ISO from WSL runner

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/trigger/recover-existing-iso-wsl.txt'

permissions:
  contents: read

concurrency:
  group: recover-existing-iso-wsl-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recover-iso:
    name: Locate and publish existing Android ISO from persistent WSL workspace
    runs-on: [self-hosted, Linux, X64, android-build]
    timeout-minutes: 120
    steps:
      - name: Checkout without cleaning persistent workspace
        uses: actions/checkout@v7.0.1
        with:
          clean: false
          fetch-depth: 1

      - name: Locate ISO candidates
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .work/iso-recovery
          report=.work/iso-recovery/ISO-RECOVERY-REPORT.txt
          candidates=.work/iso-recovery/iso-candidates.txt
          : > "$candidates"

          {
            echo "RUNNER_NAME=${RUNNER_NAME:-unknown}"
            echo "RUNNER_OS=${RUNNER_OS:-unknown}"
            echo "RUNNER_ARCH=${RUNNER_ARCH:-unknown}"
            echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
            echo "RUNNER_WORKSPACE=${RUNNER_WORKSPACE:-unknown}"
            echo "HOME=$HOME"
            echo "generated_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo '=== filesystem ==='
            df -h . || true
            echo
            echo '=== candidate ISO files ==='
          } > "$report"

          roots=("$GITHUB_WORKSPACE")
          [[ -n "${RUNNER_WORKSPACE:-}" && -d "${RUNNER_WORKSPACE}" ]] && roots+=("$RUNNER_WORKSPACE")
          [[ -d "$HOME/AccessibleAndroid-builder" ]] && roots+=("$HOME/AccessibleAndroid-builder")
          [[ -d "$HOME/actions-runner-android" ]] && roots+=("$HOME/actions-runner-android")

          for root in "${roots[@]}"; do
            echo "Scanning: $root" | tee -a "$report"
            find "$root" -xdev -type f \( -iname '*.iso' -o -iname '*.iso.sha256' \) -printf '%T@\t%s\t%p\n' 2>/dev/null || true
          done | sort -nr -k1,1 | tee "$candidates" >> "$report"

          iso_path="$(awk -F '\t' '$3 ~ /\.iso$/ {print $3; exit}' "$candidates")"
          if [[ -z "$iso_path" ]]; then
            echo 'ISO_FOUND=NO' | tee -a "$report"
            echo 'found=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          iso_size="$(stat -c '%s' "$iso_path")"
          iso_mtime="$(stat -c '%y' "$iso_path")"
          iso_sha256="$(sha256sum "$iso_path" | awk '{print $1}')"
          iso_name="$(basename "$iso_path")"

          {
            echo
            echo '=== selected ISO ==='
            echo "ISO_FOUND=YES"
            echo "ISO_PATH=$iso_path"
            echo "ISO_NAME=$iso_name"
            echo "ISO_SIZE_BYTES=$iso_size"
            echo "ISO_MTIME=$iso_mtime"
            echo "ISO_SHA256=$iso_sha256"
          } | tee -a "$report"

          mkdir -p .work/iso-recovery/publish
          ln -f "$iso_path" ".work/iso-recovery/publish/$iso_name" 2>/dev/null || cp --reflink=auto "$iso_path" ".work/iso-recovery/publish/$iso_name"
          printf '%s  %s\n' "$iso_sha256" "$iso_name" > ".work/iso-recovery/publish/SHA256SUMS"

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "iso_name=$iso_name" >> "$GITHUB_OUTPUT"
          echo "iso_path=$iso_path" >> "$GITHUB_OUTPUT"
          echo "iso_size=$iso_size" >> "$GITHUB_OUTPUT"
          echo "iso_sha256=$iso_sha256" >> "$GITHUB_OUTPUT"

      - name: Publish ISO recovery summary
        if: always()
        shell: bash
        run: |
          {
            echo '## WSL Android ISO recovery'
            echo
            if [[ "${{ steps.locate.outputs.found }}" == 'true' ]]; then
              echo "ISO: ${{ steps.locate.outputs.iso_name }}"
              echo "Size: ${{ steps.locate.outputs.iso_size }} bytes"
              echo "SHA-256: ${{ steps.locate.outputs.iso_sha256 }}"
              echo "Runner path: ${{ steps.locate.outputs.iso_path }}"
            else
              echo 'No ISO file was found in the persistent runner workspaces scanned.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ISO report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: WSL-ISO-Recovery-Report-${{ github.run_id }}
          path: .work/iso-recovery/ISO-RECOVERY-REPORT.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload recovered Android ISO
        if: steps.locate.outputs.found == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: AccessibleAndroid-ISO-${{ github.run_id }}
          path: .work/iso-recovery/publish/**
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
