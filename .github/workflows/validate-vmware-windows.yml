name: AccessibleAndroid VMware final gate

on:
  workflow_run:
    workflows: ["AccessibleAndroid recovery and resume"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  vmware:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Confirm upstream run
        shell: pwsh
        run: |
          Write-Host "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}"
