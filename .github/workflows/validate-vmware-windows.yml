name: AccessibleAndroid VMware final gate

on:
  workflow_run:
    workflows:
      - AccessibleAndroid recovery and resume
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_run_id:
        description: GitHub run ID containing the AccessibleAndroid VMware VMDK artifact
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: accessibleandroid-vmware-final-gate
  cancel-in-progress: true

jobs:
  vmware:
    name: Prove Android partitions and framework boot in VMware Workstation
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    env:
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout validation scripts
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          clean: true

      - name: Verify VMware and GitHub CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh --version
          if ($LASTEXITCODE -ne 0) { throw 'gh CLI unavailable' }
          $vmrun = Get-Command vmrun.exe -ErrorAction SilentlyContinue
          if (-not $vmrun) {
            $paths = @(
              "$env:ProgramFiles\VMware\VMware Workstation\vmrun.exe",
              "${env:ProgramFiles(x86)}\VMware\VMware Workstation\vmrun.exe"
            )
            $vmrun = $paths | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          }
          if (-not $vmrun) { throw 'VMware Workstation vmrun.exe not found' }
          Write-Host "VMRUN=$vmrun"
          Write-Host "SOURCE_RUN_ID=$env:SOURCE_RUN_ID"

      - name: Download VMDK from Linux build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path .work\vmware-input | Out-Null
          $artifact = "AccessibleAndroid-17-VMware-$env:SOURCE_RUN_ID"
          gh run download $env:SOURCE_RUN_ID --repo "$env:GITHUB_REPOSITORY" --name $artifact --dir .work\vmware-input
          if ($LASTEXITCODE -ne 0) { throw "Failed to download artifact $artifact" }
          Get-ChildItem .work\vmware-input -Recurse | Select-Object FullName, Length

      - name: Verify downloaded VMDK hash
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vmdk = Get-ChildItem .work\vmware-input -Recurse -Filter *.vmdk | Select-Object -First 1
          if (-not $vmdk) { throw 'No VMDK found in downloaded artifact' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $vmdk.FullName).Hash.ToLowerInvariant()
          Write-Host "VMWARE_VMDK=$($vmdk.FullName)"
          Write-Host "VMWARE_VMDK_SHA256=$hash"
          "VMWARE_VMDK=$($vmdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Boot AccessibleAndroid in VMware and prove partition discovery
        shell: pwsh
        run: |
          .\scripts\test-vmware-windows.ps1 -Vmdk "$env:VMWARE_VMDK" -TimeoutSeconds 420

      - name: Upload VMware evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: AccessibleAndroid-VMware-Evidence-${{ github.run_id }}
          path: .work/logs/vmware/**
          if-no-files-found: warn
          retention-days: 30
