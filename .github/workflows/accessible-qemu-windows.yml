name: AccessibleQEMU Windows

on:
  push:
    paths:
      - 'accessible-qemu/**'
      - 'config/utm-upstreams.env'
      - 'docs/ACCESSIBLE_QEMU.md'
      - 'docs/UTM_DESIGN_IMPORTS.md'
      - 'docs/WINDOWS_11_26H2.md'
      - '.github/workflows/accessible-qemu-windows.yml'
  pull_request:
    paths:
      - 'accessible-qemu/**'
      - 'config/utm-upstreams.env'
      - 'docs/ACCESSIBLE_QEMU.md'
      - 'docs/UTM_DESIGN_IMPORTS.md'
      - 'docs/WINDOWS_11_26H2.md'
      - '.github/workflows/accessible-qemu-windows.yml'
  workflow_dispatch:
    inputs:
      run_windows_11_26h2:
        description: 'Run real Windows 11 26H2 self-hosted validation'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-windows:
    name: Build AccessibleQEMU on Windows x64
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Show Rust toolchain
        shell: pwsh
        run: |
          rustc -vV
          cargo -V

      - name: Cargo check
        shell: pwsh
        run: cargo check --manifest-path accessible-qemu/Cargo.toml

      - name: Cargo tests
        shell: pwsh
        run: cargo test --manifest-path accessible-qemu/Cargo.toml

      - name: Build release executable
        shell: pwsh
        run: cargo build --release --manifest-path accessible-qemu/Cargo.toml

      - name: Verify executable, configuration and deterministic QEMU topology
        shell: pwsh
        run: |
          $exe = 'accessible-qemu/target/release/accessible-qemu.exe'
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          Get-Item $exe | Format-List FullName,Length,LastWriteTime

          $help = (& $exe --help | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "AccessibleQEMU --help failed with exit code $LASTEXITCODE" }
          foreach ($required in @('--config','--write-config','--print-qemu-command','--serial-log','--qmp-port')) {
            if ($help -notmatch [regex]::Escape($required)) {
              throw "AccessibleQEMU --help is missing $required"
            }
          }

          $version = (& $exe --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "AccessibleQEMU --version failed with exit code $LASTEXITCODE" }
          if ($version -notmatch '^AccessibleQEMU 0\.1\.0$') {
            throw "Unexpected AccessibleQEMU version output: $version"
          }

          $temp = Join-Path $env:RUNNER_TEMP 'accessible-qemu-ci'
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          $disk = Join-Path $temp 'android.qcow2'
          $iso = Join-Path $temp 'android.iso'
          $config = Join-Path $temp 'android.aqemu.json'
          New-Item -ItemType File -Force -Path $disk,$iso | Out-Null

          & $exe --disk $disk --iso $iso --serial-log (Join-Path $temp 'serial.log') --write-config $config
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $config)) { throw 'Configuration write failed.' }
          $json = Get-Content $config -Raw | ConvertFrom-Json
          if ($json.schema -ne 1 -or $json.memory_mib -ne 4096 -or $json.cpu_count -ne 4) {
            throw 'Unexpected saved VM configuration.'
          }

          $command = (& $exe --config $config --print-qemu-command | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'QEMU command generation failed.' }
          foreach ($required in @(
            'virtio-blk-pci,drive=osdisk,bus=pcie.0,addr=0x6',
            'format=qcow2',
            'virtio-net-pci,netdev=net0,bus=pcie.0,addr=0x7',
            'virtio-rng-pci,bus=pcie.0,addr=0x8',
            'tcp:127.0.0.1:4444,server=on,wait=off'
          )) {
            if ($command -notmatch [regex]::Escape($required)) {
              throw "Generated QEMU topology is missing: $required"
            }
          }
          Write-Host $command

      - name: Upload Windows executable
        uses: actions/upload-artifact@v7.0.1
        with:
          name: AccessibleQEMU-windows-x64
          path: accessible-qemu/target/release/accessible-qemu.exe
          if-no-files-found: error

  windows-11-26h2-runtime:
    name: Real Windows 11 26H2 accessibility host validation
    if: github.event_name == 'workflow_dispatch' && inputs.run_windows_11_26h2
    runs-on: [self-hosted, Windows, X64, windows-11-26h2]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Verify Windows 11 26H2 host
        shell: pwsh
        run: |
          $cv = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          $displayVersion = [string]$cv.DisplayVersion
          $build = [int]$cv.CurrentBuildNumber
          Write-Host "ProductName=$($cv.ProductName)"
          Write-Host "DisplayVersion=$displayVersion"
          Write-Host "Build=$build"
          if ($displayVersion -ne '26H2') { throw "Expected Windows 11 26H2, got $displayVersion" }
          if ($build -lt 26300) { throw "Expected Windows 11 26H2 build >= 26300, got $build" }

      - name: Build and test release executable
        shell: pwsh
        run: |
          cargo test --manifest-path accessible-qemu/Cargo.toml
          cargo build --release --manifest-path accessible-qemu/Cargo.toml
          $exe = 'accessible-qemu/target/release/accessible-qemu.exe'
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw 'AccessibleQEMU --help failed.' }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw 'AccessibleQEMU --version failed.' }

      - name: Detect QEMU
        shell: pwsh
        run: |
          $candidates = @(
            (Get-Command qemu-system-x86_64.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -ErrorAction SilentlyContinue),
            'C:\Program Files\qemu\qemu-system-x86_64.exe',
            'C:\Program Files (x86)\qemu\qemu-system-x86_64.exe'
          ) | Where-Object { $_ -and (Test-Path $_) }
          if (-not $candidates) { throw 'QEMU x86_64 is not installed on the Windows 11 26H2 validation host.' }
          $qemu = $candidates | Select-Object -First 1
          Write-Host "QEMU=$qemu"
          & $qemu --version

      - name: Record screen-reader availability
        shell: pwsh
        run: |
          $names = @('nvda','jfw','Narrator')
          foreach ($name in $names) {
            $proc = Get-Process -Name $name -ErrorAction SilentlyContinue
            if ($proc) {
              Write-Host "$name=RUNNING"
            } else {
              Write-Host "$name=NOT_RUNNING"
            }
          }
          Write-Host 'NOTE: process detection is not a substitute for the required real keyboard/UIA screen-reader task suite.'
