name: Validate Android layout

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Verify product and partition geometry
        shell: bash
        run: |
          set -euo pipefail

          board=device/accessibledroid/accessible_x86_64/BoardConfig.mk
          products=device/accessibledroid/accessible_x86_64/AndroidProducts.mk
          source config/vm.env
          source config/editions.env
          source config/upstream.env

          value() {
            local key="$1"
            awk -v key="$key" '$1 == key && $2 == ":=" { print $3; exit }' "$board"
          }

          super_bytes="$(value BOARD_SUPER_PARTITION_SIZE)"
          system_group="$(value BOARD_ACCESSIBLE_SYSTEM_DYNAMIC_PARTITIONS_SIZE)"
          vendor_group="$(value BOARD_ACCESSIBLE_VENDOR_DYNAMIC_PARTITIONS_SIZE)"
          userdata_bytes="$(value BOARD_USERDATAIMAGE_PARTITION_SIZE)"
          boot_bytes="$(value BOARD_BOOTIMAGE_PARTITION_SIZE)"
          init_boot_bytes="$(value BOARD_INIT_BOOT_IMAGE_PARTITION_SIZE)"
          vendor_boot_bytes="$(value BOARD_VENDOR_BOOTIMAGE_PARTITION_SIZE)"

          for n in "$super_bytes" "$system_group" "$vendor_group" "$userdata_bytes" "$boot_bytes" "$init_boot_bytes" "$vendor_boot_bytes"; do
            [[ "$n" =~ ^[0-9]+$ ]]
          done

          expected_super=$((VM_SUPER_SIZE_MIB * 1024 * 1024))
          expected_userdata=$((VM_USERDATA_SIZE_MIB * 1024 * 1024))
          disk_bytes=$((VM_DISK_SIZE_GIB * 1024 * 1024 * 1024))
          groups_total=$((system_group + vendor_group))
          fixed_android_payload=$((super_bytes + userdata_bytes + boot_bytes + init_boot_bytes + vendor_boot_bytes))

          test "$super_bytes" -eq "$expected_super"
          test "$userdata_bytes" -eq "$expected_userdata"
          test "$groups_total" -le "$super_bytes"
          test "$fixed_android_payload" -lt "$disk_bytes"

          grep -Fq "${AOSP_PRODUCT}-${ANDROID_RELEASE_CONFIG}-userdebug" "$products"
          grep -Fq "${GMS_PRODUCT}-${ANDROID_RELEASE_CONFIG}-userdebug" "$products"
          grep -Fq 'PRODUCT_NAME := accessible_android_x86_64' device/accessibledroid/accessible_x86_64/accessible_android_x86_64.mk
          grep -Fq 'PRODUCT_NAME := accessible_android_x86_64_gms' device/accessibledroid/accessible_x86_64/accessible_android_x86_64_gms.mk

          echo "SUPER_BYTES=$super_bytes"
          echo "DYNAMIC_GROUPS_TOTAL=$groups_total"
          echo "DYNAMIC_GROUP_HEADROOM=$((super_bytes - groups_total))"
          echo "USERDATA_BYTES=$userdata_bytes"
          echo "FIXED_ANDROID_PAYLOAD_BYTES=$fixed_android_payload"
          echo "VM_DISK_BYTES=$disk_bytes"
          echo 'ANDROID_LAYOUT_ARITHMETIC = PASS'
