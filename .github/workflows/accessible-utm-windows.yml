name: AccessibleUTM Windows portable

on:
  push:
    branches:
      - accessible-virtual-suite
    paths:
      - 'accessible-utm/**'
      - 'scripts/Start-AccessibleAndroid-UTM.ps1'
      - 'config/vm.env'
      - 'docs/ACCESSIBLE_VIRTUAL_SUITE.md'
      - '.github/workflows/accessible-utm-windows.yml'
  pull_request:
    paths:
      - 'accessible-utm/**'
      - 'scripts/Start-AccessibleAndroid-UTM.ps1'
      - 'config/vm.env'
      - 'docs/ACCESSIBLE_VIRTUAL_SUITE.md'
      - '.github/workflows/accessible-utm-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accessible-utm-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build self-contained AccessibleUTM on Windows x64
    runs-on: windows-2025
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Show Rust toolchain
        shell: pwsh
        run: |
          rustc -vV
          cargo -V
          rustc --print cfg -C target-feature=+crt-static | Select-String 'target_feature="crt-static"'
          if ($LASTEXITCODE -ne 0) { throw 'Rust static CRT target feature is unavailable.' }

      - name: Cache Cargo registry and release target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            accessible-utm/target
          key: accessible-utm-crt-static-${{ runner.os }}-${{ hashFiles('accessible-utm/Cargo.toml', 'accessible-utm/Cargo.lock') }}
          restore-keys: |
            accessible-utm-crt-static-${{ runner.os }}-
          save-always: true

      - name: Parse AccessibleAndroid launcher
        shell: pwsh
        run: |
          $path = 'scripts/Start-AccessibleAndroid-UTM.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Host
            throw "PowerShell parser found $($errors.Count) error(s) in $path"
          }

      - name: Verify committed Cargo lockfile
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'accessible-utm/Cargo.lock')) {
            throw 'accessible-utm/Cargo.lock must be committed.'
          }
          cargo metadata --locked --no-deps --manifest-path accessible-utm/Cargo.toml --format-version 1 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "cargo metadata --locked failed: $LASTEXITCODE" }
          git diff --exit-code -- accessible-utm/Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw 'Cargo.lock changed during locked metadata validation.' }
          Write-Host 'ACCESSIBLE_UTM_CARGO_LOCK = VERIFIED'

      - name: Cargo tests in release profile
        shell: pwsh
        run: cargo test --release --locked --manifest-path accessible-utm/Cargo.toml

      - name: Build release executable
        shell: pwsh
        run: cargo build --release --locked --manifest-path accessible-utm/Cargo.toml

      - name: Prove Microsoft VC runtime is statically linked
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'accessible-utm/target/release/accessible-utm.exe').Path
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw "Missing vswhere: $vswhere" }
          $vs = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Out-String).Trim()
          if ([string]::IsNullOrWhiteSpace($vs)) { throw 'Visual Studio C++ tools were not found.' }
          $dumpbin = Get-ChildItem -Path (Join-Path $vs 'VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe') -File | Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $dumpbin) { throw 'dumpbin.exe was not found.' }
          $deps = (& $dumpbin.FullName /DEPENDENTS $exe | Out-String)
          Write-Host $deps
          $forbidden = @('VCRUNTIME140.dll', 'VCRUNTIME140_1.dll', 'MSVCP140.dll', 'MSVCP140_1.dll', 'MSVCP140_2.dll')
          foreach ($dll in $forbidden) {
            if ($deps -match [regex]::Escape($dll)) {
              throw "Portable AccessibleUTM still depends on external Microsoft VC runtime: $dll"
            }
          }
          Write-Host 'ACCESSIBLE_UTM_STATIC_CRT = PASS'

      - name: Verify CLI and AccessibleAndroid x86 contract
        shell: pwsh
        run: |
          $exe = 'accessible-utm/target/release/accessible-utm.exe'
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          $help = (& $exe --help | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "AccessibleUTM --help failed: $LASTEXITCODE" }
          if ($help -notmatch 'AccessibleUTM Windows' -or $help -notmatch '--arch' -or $help -notmatch '--profile' -or $help -notmatch '--config') {
            throw 'AccessibleUTM help is missing required multi-architecture/profile/config controls.'
          }
          $version = (& $exe --version | Out-String).Trim()
          if ($version -ne 'AccessibleUTM 0.1.0') { throw "Unexpected version: $version" }
          $android = (& $exe --profile accessible-android --arch x86_64 --disk AccessibleAndroid.qcow2 --firmware OVMF_CODE.fd --print-qemu-command | Out-String)
          $requiredAndroid = @(
            'qemu-system-x86_64',
            'q35,accel=whpx:tcg',
            'if=none,id=osdisk,file=AccessibleAndroid.qcow2,format=qcow2',
            'virtio-blk-pci,drive=osdisk,bus=pcie.0,addr=0x6,bootindex=1',
            'virtio-rng-pci,bus=pcie.0,addr=0x7',
            'virtio-net-pci,netdev=net0,bus=pcie.0,addr=0x8',
            'virtio-vga,id=android-gpu',
            'qemu-xhci,id=xhci',
            'usb-kbd,bus=xhci.0,id=android-keyboard',
            'usb-tablet,bus=xhci.0,id=android-tablet',
            '-audiodev dsound,id=android-audio',
            'virtio-sound-pci,audiodev=android-audio,streams=2,id=android-sound',
            '-bios OVMF_CODE.fd'
          )
          foreach ($needle in $requiredAndroid) {
            if ($android -notlike "*$needle*") { throw "Android contract missing '$needle'`n$android" }
          }
          $forbiddenAndroidPatterns = @(
            '(?<!\S)-vga\s+virtio(?:\s|$)',
            '(?<!\S)-audio(?:\s|$)',
            'driver=dsound,model=virtio'
          )
          foreach ($pattern in $forbiddenAndroidPatterns) {
            if ($android -match $pattern) { throw "Deprecated Android QEMU syntax matched '$pattern'`n$android" }
          }
          Write-Host 'ACCESSIBLE_UTM_ANDROID_VM_CONTRACT = PASS'

      - name: Verify ARM64 and RISC-V command generation
        shell: pwsh
        run: |
          $exe = 'accessible-utm/target/release/accessible-utm.exe'
          $arm = (& $exe --profile linux --arch aarch64 --disk linux-arm64.qcow2 --print-qemu-command | Out-String)
          if ($arm -notlike '*qemu-system-aarch64*') { throw "ARM64 QEMU executable missing.`n$arm" }
          if ($arm -notlike '*virt,accel=tcg*') { throw "ARM64 virt/TCG machine missing.`n$arm" }
          if ($arm -like '*addr=0x6*') { throw "ARM64 generic VM must not inherit Android x86 PCI pinning.`n$arm" }
          $riscv = (& $exe --profile linux --arch riscv64 --disk linux-riscv64.qcow2 --print-qemu-command | Out-String)
          if ($riscv -notlike '*qemu-system-riscv64*') { throw "RISC-V QEMU executable missing.`n$riscv" }
          if ($riscv -notlike '*virt,accel=tcg*') { throw "RISC-V virt/TCG machine missing.`n$riscv" }
          Write-Host 'MULTI_ARCH_COMMAND_GENERATION = PASS'

      - name: Verify accessibility source contract
        shell: pwsh
        run: |
          $source = Get-Content -LiteralPath 'accessible-utm/src/main.rs' -Raw
          $required = @(
            'labelled_by',
            'Start virtual machine (F5)',
            'Pause virtual machine (F6)',
            'Resume virtual machine (F7)',
            'Request graceful shutdown (F8)',
            'Print QEMU command (F9)',
            'Save configuration (Ctrl+S)',
            'Load configuration (Ctrl+O)',
            'set_live(egui::accesskit::Live::Polite)',
            'set_live_atomic'
          )
          foreach ($needle in $required) {
            if ($source -notlike "*$needle*") { throw "Accessibility source contract missing '$needle'" }
          }
          Write-Host 'ACCESSIBLE_UTM_ACCESSIBILITY_SOURCE_CONTRACT = PASS'

      - name: Probe Windows UI Automation on hosted runner
        id: hosted_uia
        continue-on-error: true
        shell: pwsh
        run: ./accessible-utm/tests/windows_uia_smoke.ps1 -Executable 'accessible-utm/target/release/accessible-utm.exe'

      - name: Classify hosted UI Automation result
        shell: pwsh
        run: |
          if ('${{ steps.hosted_uia.outcome }}' -eq 'success') {
            Write-Host 'ACCESSIBLE_UTM_UIA_HOSTED_RUNTIME = PASS'
          }
          else {
            Write-Host 'ACCESSIBLE_UTM_UIA_HOSTED_RUNTIME = UNVERIFIED'
          }

      - name: Download and stage pinned QEMU 11.1.0 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://qemu.weilnetz.de/w64/2026/qemu-w64-setup-20260811.exe'
          $expected = '5bcf9eed634e8575a37b74f445af41a2fe4106da512d0c30c368301d4c105037fdfab40a5287367a28a957624cddebbc8c07e16c88ab6634f554cdf3d16bf543'
          $installer = Join-Path $env:RUNNER_TEMP 'qemu-w64-setup-20260811.exe'
          $qemuDir = Join-Path $env:RUNNER_TEMP 'qemu-portable'
          Remove-Item -LiteralPath $qemuDir -Recurse -Force -ErrorAction SilentlyContinue
          Invoke-WebRequest -Uri $url -OutFile $installer
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA512).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "QEMU installer SHA-512 mismatch: $actual" }
          Write-Host 'QEMU_INSTALLER_SHA512 = VERIFIED'
          $arguments = @('/SP-', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOICONS', "/DIR=$qemuDir")
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "QEMU installer failed: $($process.ExitCode)" }
          $required = @('qemu-system-x86_64.exe','qemu-system-aarch64.exe','qemu-system-riscv64.exe','qemu-img.exe')
          foreach ($name in $required) {
            $path = Join-Path $qemuDir $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "QEMU runtime missing $name" }
          }
          $version = (& (Join-Path $qemuDir 'qemu-system-x86_64.exe') --version | Select-Object -First 1 | Out-String).Trim()
          if ($version -notmatch 'QEMU emulator version 11\.1\.0') { throw "Unexpected QEMU version: $version" }
          "QEMU_PORTABLE_DIR=$qemuDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "QEMU_PORTABLE_DIR = $qemuDir"
          Write-Host 'QEMU_PORTABLE_RUNTIME = PASS'

      - name: Build and verify deterministic self-contained Windows ZIP
        shell: pwsh
        run: |
          $exe = 'accessible-utm/target/release/accessible-utm.exe'
          $env:SOURCE_DATE_EPOCH = (& git show -s --format=%ct HEAD | Out-String).Trim()
          if ($env:SOURCE_DATE_EPOCH -notmatch '^\d+$') { throw "Invalid SOURCE_DATE_EPOCH: $env:SOURCE_DATE_EPOCH" }
          ./accessible-utm/scripts/package-windows.ps1 -Executable $exe -QemuDirectory $env:QEMU_PORTABLE_DIR
          $zip = Get-ChildItem 'accessible-utm/dist/AccessibleUTM-*-windows-x64-portable.zip' | Select-Object -First 1
          if ($null -eq $zip) { throw 'AccessibleUTM portable ZIP was not generated.' }
          $hash1 = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash
          ./accessible-utm/scripts/package-windows.ps1 -Executable $exe -QemuDirectory $env:QEMU_PORTABLE_DIR
          $zip = Get-ChildItem 'accessible-utm/dist/AccessibleUTM-*-windows-x64-portable.zip' | Select-Object -First 1
          $hash2 = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash
          if ($hash1 -ne $hash2) { throw "AccessibleUTM portable package is not reproducible: $hash1 != $hash2" }
          Write-Host 'ACCESSIBLE_UTM_PORTABLE_ZIP_REPRODUCIBILITY = PASS'
          Write-Host "ACCESSIBLE_UTM_PORTABLE_ZIP_SHA256 = $($hash2.ToLowerInvariant())"

      - name: Prove extracted package works without global QEMU
        shell: pwsh
        run: |
          $zip = Get-ChildItem 'accessible-utm/dist/AccessibleUTM-*-windows-x64-portable.zip' | Select-Object -First 1
          $extract = Join-Path $env:RUNNER_TEMP 'portable-proof'
          Remove-Item -LiteralPath $extract -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $extract
          & (Join-Path $extract 'Verify-Runtime.ps1')
          if ($LASTEXITCODE -ne 0) { throw "Extracted runtime verification failed: $LASTEXITCODE" }
          $app = Join-Path $extract 'AccessibleUTM.exe'
          $command = (& $app --profile accessible-android --arch x86_64 --disk AccessibleAndroid.qcow2 --print-qemu-command | Out-String)
          $bundled = Join-Path $extract 'qemu\qemu-system-x86_64.exe'
          if ($command -notlike "*$bundled*") {
            throw "Extracted AccessibleUTM did not select bundled QEMU.`nExpected: $bundled`nActual: $command"
          }
          if ($command -like '*C:\Program Files\qemu*') {
            throw "Extracted package unexpectedly depends on globally installed QEMU.`n$command"
          }
          Write-Host 'ACCESSIBLE_UTM_NO_GLOBAL_QEMU_REQUIRED = PASS'
          Write-Host 'ACCESSIBLE_UTM_EXTRACTED_PORTABLE_PROOF = PASS'

      - name: Upload self-contained Windows package and accessibility evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: AccessibleUTM-windows-x64-portable
          path: |
            accessible-utm/dist/*-portable.zip
            accessible-utm/dist/*-portable/SHA256SUMS.txt
            ${{ runner.temp }}/accessible-utm-uia-tree.json
          if-no-files-found: error
