name: AccessibleAndroid 17 Final Build Auto

on:
  push:
    branches:
      - accessible-virtual-suite
    paths:
      - '.github/workflows/android-final-build-auto.yml'
      - 'scripts/assemble-complete-windows-bundle.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: accessible-android17-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-build:
    name: Build and prove AccessibleAndroid 17 final images
    runs-on: [self-hosted, Linux, X64, android-build]
    timeout-minutes: 720
    steps:
      - name: Checkout without deleting persistent AOSP workspace
        uses: actions/checkout@v7.0.1
        with:
          clean: false
          fetch-depth: 1

      - name: Select conservative build parallelism and inspect host
        shell: bash
        run: |
          set -euo pipefail
          ram_kib=$(awk '/MemTotal:/ {print $2}' /proc/meminfo)
          ram_gib=$((ram_kib / 1024 / 1024))
          cpus=$(nproc)
          free_gib=$(df -Pk . | awk 'NR==2 {print int($4 / 1024 / 1024)}')

          if (( ram_gib < 16 )); then
            jobs=2
          elif (( ram_gib < 32 )); then
            jobs=4
          elif (( ram_gib < 64 )); then
            jobs=6
          else
            jobs=12
          fi
          (( jobs > cpus )) && jobs=$cpus
          (( jobs < 1 )) && jobs=1

          sync_jobs=$jobs
          (( sync_jobs > 8 )) && sync_jobs=8
          kernel_jobs=$jobs
          (( kernel_jobs > 4 )) && kernel_jobs=4

          echo "ANDROID_BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
          echo "SYNC_JOBS=$sync_jobs" >> "$GITHUB_ENV"
          echo "KERNEL_SYNC_JOBS=$kernel_jobs" >> "$GITHUB_ENV"
          echo 'SYNC_RETRIES=5' >> "$GITHUB_ENV"
          echo 'SYNC_RETRY_DELAY_SECONDS=10' >> "$GITHUB_ENV"
          echo 'REUSE_KERNEL_DIST=1' >> "$GITHUB_ENV"
          echo 'REUSE_ACCESSIBILITY_APPS=1' >> "$GITHUB_ENV"
          echo 'BOOT_TIMEOUT_SECONDS=360' >> "$GITHUB_ENV"

          echo "RUNNER_NAME=${RUNNER_NAME}"
          echo "RAM_GIB=$ram_gib"
          echo "CPU_COUNT=$cpus"
          echo "FREE_DISK_GIB=$free_gib"
          echo "ANDROID_BUILD_JOBS=$jobs"
          echo "SYNC_JOBS=$sync_jobs"
          echo "KERNEL_SYNC_JOBS=$kernel_jobs"
          if [[ -d .work/aosp/.repo ]]; then
            echo 'AOSP_WORKSPACE=incremental'
          else
            echo 'AOSP_WORKSPACE=fresh'
          fi
          if [[ -r /dev/kvm && -w /dev/kvm ]]; then
            echo 'QEMU_ACCEL=kvm' >> "$GITHUB_ENV"
            echo 'QEMU_ACCEL=kvm'
          else
            echo 'QEMU_ACCEL=tcg' >> "$GITHUB_ENV"
            echo 'QEMU_ACCEL=tcg'
          fi

      - name: Verify required host tools
        shell: bash
        run: |
          set -euo pipefail
          required=(repo git python3 java bash sha256sum qemu-img qemu-system-x86_64 sgdisk losetup grub-install mkfs.vfat mkfs.ext4)
          missing=0
          for command_name in "${required[@]}"; do
            if command -v "$command_name" >/dev/null 2>&1; then
              printf '%-24s %s\n' "$command_name" "$(command -v "$command_name")"
            else
              echo "MISSING: $command_name" >&2
              missing=1
            fi
          done
          test "$missing" -eq 0
          if (( EUID != 0 )); then
            sudo -n true
          fi

      - name: Resume synchronized Android 17 sources and build accessibility edition
        shell: bash
        env:
          BOOTSTRAP_HOST: '0'
          BOOTSTRAP_SDK: '1'
          BUILD_KERNEL: '1'
        run: |
          set -euo pipefail
          mkdir -p .work/logs
          bash scripts/build-from-zero.sh accessible-aosp 2>&1 | tee .work/logs/final-build-from-zero.txt

      - name: Build final BIOS and UEFI GPT disk in all formats
        shell: bash
        env:
          EXPORT_ALL_FORMATS: '1'
        run: |
          set -euo pipefail
          bash scripts/build-preinstalled-disk.sh 2>&1 | tee .work/logs/final-build-preinstalled-disk.txt

      - name: Prove full VM boot in BIOS and UEFI
        shell: bash
        run: |
          set -euo pipefail
          TEST_MODE=all HARDWARE_PROFILE=full bash scripts/test-preinstalled-disk-qemu.sh 2>&1 | tee .work/logs/final-preinstalled-qemu-proof.txt

      - name: Select and verify final QCOW2 image
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t images < <(find .work/vm/preinstalled -maxdepth 1 -type f -name '*.qcow2' | sort)
          if (( ${#images[@]} == 0 )); then
            echo 'ERROR: final QCOW2 image not found.' >&2
            exit 1
          fi
          image="${images[0]}"
          qemu-img info --output=json "$image" | tee .work/logs/final-qcow2-info.json
          qemu-img check "$image" | tee .work/logs/final-qcow2-check.txt
          echo "FINAL_QCOW2=$image" >> "$GITHUB_ENV"
          echo "FINAL_QCOW2_SHA256=$(sha256sum "$image" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo 'FINAL_QCOW2 = VERIFIED'

      - name: Download latest proven self-contained AccessibleUTM Windows artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'AccessibleAndroid-final-builder',
          }

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          runs_url = (
              f'https://api.github.com/repos/{repo}/actions/workflows/'
              'accessible-utm-windows.yml/runs?branch=accessible-virtual-suite&status=success&per_page=30'
          )
          runs = get_json(runs_url).get('workflow_runs', [])
          selected = None
          artifact = None
          for run in runs:
              artifacts = get_json(
                  f'https://api.github.com/repos/{repo}/actions/runs/{run["id"]}/artifacts?per_page=100'
              ).get('artifacts', [])
              match = next((a for a in artifacts if a['name'] == 'AccessibleUTM-windows-x64-portable' and not a['expired']), None)
              if match:
                  selected = run
                  artifact = match
                  break
          if artifact is None:
              raise SystemExit('No successful non-expired self-contained AccessibleUTM Windows artifact is available.')

          destination = Path('.work/windows-portable-artifact.zip')
          destination.parent.mkdir(parents=True, exist_ok=True)
          req = urllib.request.Request(artifact['archive_download_url'], headers=headers)
          with urllib.request.urlopen(req) as response, destination.open('wb') as out:
              while True:
                  chunk = response.read(8 * 1024 * 1024)
                  if not chunk:
                      break
                  out.write(chunk)
          print(f'WINDOWS_PORTABLE_RUN_ID={selected["id"]}')
          print(f'WINDOWS_PORTABLE_ARTIFACT_ID={artifact["id"]}')
          print(f'WINDOWS_PORTABLE_ARTIFACT={destination}')
          PY
          test -s .work/windows-portable-artifact.zip
          echo 'WINDOWS_PORTABLE_ARTIFACT = VERIFIED'

      - name: Assemble zero-touch Windows plus AccessibleAndroid complete bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .work/final-delivery
          source_epoch="$(git show -s --format=%ct HEAD)"
          python3 scripts/assemble-complete-windows-bundle.py \
            --portable-artifact .work/windows-portable-artifact.zip \
            --android-image "$FINAL_QCOW2" \
            --output .work/final-delivery/AccessibleUTM-AccessibleAndroid17-windows-x64-complete.zip \
            --source-commit "$GITHUB_SHA" \
            --source-date-epoch "$source_epoch" \
            | tee .work/logs/final-windows-complete-bundle.txt
          test -s .work/final-delivery/AccessibleUTM-AccessibleAndroid17-windows-x64-complete.zip
          test -s .work/final-delivery/AccessibleUTM-AccessibleAndroid17-windows-x64-complete.zip.sha256
          echo 'FINAL_WINDOWS_ALL_IN_ONE = PASS'

      - name: Generate final evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .work/final-evidence
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "runner=${RUNNER_NAME}"
            echo "qemu_accel=${QEMU_ACCEL:-unknown}"
            echo "android_build_jobs=${ANDROID_BUILD_JOBS:-unknown}"
            echo "sync_jobs=${SYNC_JOBS:-unknown}"
            echo "final_qcow2=${FINAL_QCOW2:-unknown}"
            echo "final_qcow2_sha256=${FINAL_QCOW2_SHA256:-unknown}"
            echo "generated_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > .work/final-evidence/BUILD-INFO.txt
          find .work/vm -maxdepth 3 -type f \( -name '*.iso' -o -name '*.qcow2' -o -name '*.vdi' -o -name '*.vmdk' -o -name 'SHA256SUMS' -o -name '*MANIFEST*' \) -print | sort > .work/final-evidence/FILES.txt || true
          while IFS= read -r file; do
            [[ -f "$file" ]] && sha256sum "$file"
          done < .work/final-evidence/FILES.txt > .work/final-evidence/SHA256SUMS.txt
          if [[ -f .work/final-delivery/AccessibleUTM-AccessibleAndroid17-windows-x64-complete.zip.sha256 ]]; then
            cp .work/final-delivery/AccessibleUTM-AccessibleAndroid17-windows-x64-complete.zip.sha256 .work/final-evidence/
          fi

      - name: Upload final validation evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: AccessibleAndroid-17-final-evidence-${{ github.run_id }}
          path: |
            .work/logs/**
            .work/final-evidence/**
            .work/vm/preinstalled/DISK-MANIFEST.txt
            .work/vm/preinstalled/GPT.txt
            .work/vm/preinstalled/SHA256SUMS
            config/aosp-pinned-manifest.xml
            config/kernel-pinned-manifest.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Upload final VM images
        uses: actions/upload-artifact@v7.0.1
        with:
          name: AccessibleAndroid-17-final-images-${{ github.run_id }}
          path: |
            .work/vm/**/*.iso
            .work/vm/**/*.qcow2
            .work/vm/**/*.vdi
            .work/vm/**/*.vmdk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload final zero-touch Windows bundle
        uses: actions/upload-artifact@v7.0.1
        with:
          name: AccessibleUTM-AccessibleAndroid17-windows-x64-complete-${{ github.run_id }}
          path: |
            .work/final-delivery/AccessibleUTM-AccessibleAndroid17-windows-x64-complete.zip
            .work/final-delivery/AccessibleUTM-AccessibleAndroid17-windows-x64-complete.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
