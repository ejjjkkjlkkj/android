name: Validate x86_64-only product

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-x86-64-only:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Validate canonical AOSP 64-bit-only product contract
        shell: bash
        run: |
          set -euo pipefail
          product=device/accessibledroid/accessible_x86_64/accessible_android_x86_64_base.mk
          board=device/accessibledroid/accessible_x86_64/BoardConfig.mk

          grep -Fq '$(SRC_TARGET_DIR)/product/core_64_bit_only.mk' "$product"
          if grep -Fq '$(SRC_TARGET_DIR)/product/core_64_bit.mk' "$product"; then
            echo 'ERROR: dual-ABI core_64_bit.mk must not be inherited by the x86_64-only product.' >&2
            exit 1
          fi

          generic_line="$(grep -nF 'include device/generic/x86_64/BoardConfig.mk' "$board" | cut -d: -f1)"
          test -n "$generic_line"

          for var in \
            TARGET_2ND_CPU_ABI \
            TARGET_2ND_CPU_ABI2 \
            TARGET_2ND_ARCH \
            TARGET_2ND_ARCH_VARIANT \
            TARGET_2ND_CPU_VARIANT \
            TARGET_2ND_CPU_VARIANT_RUNTIME; do
            line="$(grep -nE "^${var}[[:space:]]*:=[[:space:]]*$" "$board" | cut -d: -f1)"
            if [[ -z "$line" ]]; then
              echo "ERROR: $var is not explicitly cleared." >&2
              exit 1
            fi
            if (( line <= generic_line )); then
              echo "ERROR: $var must be cleared after importing generic_x86_64 BoardConfig." >&2
              exit 1
            fi
          done

          echo 'ACCESSIBLEANDROID_PRIMARY_ARCH = x86_64'
          echo 'ACCESSIBLEANDROID_SECONDARY_ARCH = NONE'
          echo 'ACCESSIBLEANDROID_64_BIT_ONLY = PASS'
