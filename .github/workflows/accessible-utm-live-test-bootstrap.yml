name: AccessibleUTM Live Semantics Test Bootstrap

on:
  push:
    branches:
      - accessible-virtual-suite
    paths:
      - '.github/workflows/accessible-utm-live-test-bootstrap.yml'

permissions:
  contents: write

jobs:
  add-semantic-test:
    name: Add and prove AccessKit live semantics test once
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Patch semantic assertion
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/patch_live_test.py" <<'PY'
          from pathlib import Path
          import re

          path = Path('accessible-utm/src/main.rs')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'''        assert!\(\n'''
              r'''\s*harness\n'''
              r'''\s*\.query_by_label\("QEMU command printed to stdout\."\)\n'''
              r'''\s*\.is_some\(\),\n'''
              r'''\s*"Updated status is missing from the AccessKit tree"\n'''
              r'''\s*\);'''
          )
          replacement = '''        let status_node = harness.get_by_label("QEMU command printed to stdout.");
          assert_eq!(
              status_node.accesskit_node().live(),
              Some(egui::accesskit::Live::Polite),
              "Updated status must be a polite AccessKit live region"
          );
          assert!(
              status_node.accesskit_node().is_live_atomic(),
              "Updated status live region must be atomic"
          );'''
          replacement = replacement.replace('          assert_eq!', '        assert_eq!').replace('          assert!(', '        assert!(').replace('              status_node', '            status_node').replace('              Some', '            Some').replace('              "Updated', '            "Updated').replace('          );', '        );')
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one AccessKit status assertion, replaced {count}')
          path.write_text(text, encoding='utf-8')
          PY
          python "$RUNNER_TEMP/patch_live_test.py"

      - name: Run focused semantic test with locked graph
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/live-semantic-test.log"
          cargo test --locked --manifest-path accessible-utm/Cargo.toml accesskit_semantics_expose_primary_controls_and_actions 2>&1 | tee "$output"
          grep -Eq 'test tests::accesskit_semantics_expose_primary_controls_and_actions \.\.\. ok' "$output"
          grep -Eq 'test result: ok\. 1 passed; 0 failed' "$output"
          echo 'ACCESSIBLE_UTM_LIVE_SEMANTICS = PASS'

      - name: Commit source-only patch
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = 'accessible-utm/src/main.rs'
          git add accessible-utm/src/main.rs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Test AccessibleUTM live-region semantics through AccessKit'
          git push origin HEAD:accessible-virtual-suite
          echo 'ACCESSIBLE_UTM_LIVE_SEMANTICS_TEST = COMMITTED'
