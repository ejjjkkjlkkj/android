name: AccessibleUTM Live Semantics Test Bootstrap

on:
  push:
    branches:
      - accessible-virtual-suite
    paths:
      - '.github/workflows/accessible-utm-live-test-bootstrap.yml'

permissions:
  contents: write

jobs:
  add-semantic-test:
    name: Add and prove AccessKit live semantics test once
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Patch semantic assertion
        shell: python
        run: |
          from pathlib import Path

          path = Path('accessible-utm/src/main.rs')
          text = path.read_text(encoding='utf-8')
          old = '''        assert!(
            harness
                .query_by_label("QEMU command printed to stdout.")
                .is_some(),
            "Updated status is missing from the AccessKit tree"
        );'''
          new = '''        let status_node = harness.get_by_label("QEMU command printed to stdout.");
        assert_eq!(
            status_node.accesskit_node().live(),
            Some(egui::accesskit::Live::Polite),
            "Updated status must be a polite AccessKit live region"
        );
        assert!(
            status_node.accesskit_node().is_live_atomic(),
            "Updated status live region must be atomic"
        );'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one AccessKit status assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Run focused semantic test with locked graph
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path accessible-utm/Cargo.toml accesskit_semantics_expose_primary_controls_and_actions -- --exact

      - name: Commit source-only patch
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = 'accessible-utm/src/main.rs'
          git add accessible-utm/src/main.rs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Test AccessibleUTM live-region semantics through AccessKit'
          git push origin HEAD:accessible-virtual-suite
          echo 'ACCESSIBLE_UTM_LIVE_SEMANTICS_TEST = COMMITTED'
